asyncapi: 3.0.0
info:
  title: DredgerTodos
  version: 1.0.0
  description: >-
    A NATS-based microservice that publishes todo operations, so multiple
    running microservice can share the todos.
servers:
  localNATS:
    host: localhost:4222
    protocol: nats
    description: Local development NATS server
channels:
  todos:
    address: todos
    messages:
      toDo:
        $ref: "#/components/messages/MsgToDo"
      id:
        $ref: "#/components/messages/MsgId"
operations:
  publishAddTodo:
    action: send
    summary: Publishes new todo
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/toDo"
  receiveAddToDo:
    action: receive
    summary: Receives new todo
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/toDo"
  publishDeleteTodo:
    action: send
    summary: Publishes todos and changes
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/id"
  receiveDeleteToDo:
    action: receive
    summary: Receives new todo
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/id"
  publishDoneTodo:
    action: send
    summary: Toggle done flag of a todo item
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/id"
  receiveDoneToDo:
    action: receive
    summary: Toggle done flag of a todo item
    channel:
      $ref: "#/channels/todos"
    messages:
      - $ref: "#/channels/todos/messages/id"
components:
  messages:
    MsgToDo:
      name: ToDo
      title: Task to do
      summary: A single task
      contentType: application/json
      payload:
        type: object
        properties:
          Listname:
            type: string
            description: Shared name of the task list
            example: team11
          Task:
            type: string
            description: What to do as task
            example: Write a cool micro service
          Done:
            type: boolean
            description: Task was done or not
            example: false
    MsgId:
      name: Id
      title: Id of a task
      summary: The internal id of a task in a shared list
      contentType: application/json
      payload:
        type: object
        properties:
          Listname:
            type: string
            description: Shared name of the task list
            example: team11
          Id:
            type: integer
